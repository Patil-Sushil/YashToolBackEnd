server:
  port: 8080

spring:
  application:
    name: YashTools

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # REMOVED: baseline-on-migrate, baseline-version, repair-on-migrate

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
        starttls:
          enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 604800000

app:
  company-state: ${COMPANY_STATE:Maharashtra}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  default-admin:
    email: admin@yashtools.com
    password: ${DEFAULT_ADMIN_PASSWORD}

logging:
  level:
    org.flywaydb: INFO
    org.springframework.security: INFO
    com.kalibyte.YashTools: INFO