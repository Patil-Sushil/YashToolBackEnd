spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yash_tools?useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:lightblade}
    password: ${SPRING_DATASOURCE_PASSWORD:4911}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    repair-on-migrate: true
    locations: classpath:db/migration
